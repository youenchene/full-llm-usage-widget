name: Release

# Build a signed + notarized arm64 .dmg and publish a GitHub Release when a PR is
# merged into `main`, or when a commit is pushed directly to `main` (fallback). The
# merged PR's title + body become the release note, and the .dmg is attached as the
# release asset.
#
# Versioning is SemVer derived from git tags: every merge auto-bumps the patch
# (v0.1.0 → v0.1.1 → v0.1.2). `workflow_dispatch` with a `bump` input bumps minor or
# major (v0.2.0, v1.0.0); subsequent merges continue from there.

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump — patch is automatic on merge; choose minor/major for v0.2.0, v1.0.0, etc.'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # required to create the tag + release

# A merge fires BOTH `pull_request: closed` and `push` for the same commit. Serialize
# release runs and let the tag check below de-duplicate, so a merge yields one release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Run for pushes and manual dispatches always; for `pull_request` only when merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    # `macos-14` is the Apple Silicon (arm64) runner → the build is arm64 by default.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, for versioning, release notes, and dedupe

      # Xcode 16.x ships Swift 6 (required by swift-tools-version: 6.0) and the whole
      # notarization toolchain (codesign, notarytool, stapler, hdiutil, ditto).
      # Bump this to a newer Xcode if the build needs a newer Swift.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Verify toolchain
        run: |
          swift --version
          uname -m # expect arm64

      # Decide the version tag up front and write the release notes. De-duplicates the
      # double-fire (pull_request closed + push) so a merge produces exactly one release.
      #
      # Version scheme — SemVer derived from the highest existing `vX.Y.Z` tag:
      #   patch (default, auto on merge) → v0.1.1, v0.1.2, ...
      #   minor (workflow_dispatch)      → v0.2.0, v1.x.0, ...
      #   major (workflow_dispatch)      → v1.0.0
      # If this commit is already release-tagged, we skip (the sibling event won).
      - name: Prepare release metadata
        id: meta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          BUMP="${BUMP_INPUT:-patch}"
          HEAD_SHA="$(git rev-parse HEAD)"

          # De-dupe the merge double-fire (a merge fires both `pull_request: closed` and
          # `push` for the same commit). If this commit is already release-tagged, the
          # sibling event won. Manual dispatches are exempt so you can bump minor/major on
          # an already-released commit.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] \
             && git tag --points-at "${HEAD_SHA}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already has a release tag; sibling event released it. Skipping."
            exit 0
          fi

          # Compute the next semantic version from the highest existing `vX.Y.Z` tag.
          BOOTSTRAP="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)"
          LAST_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          if [[ -z "${LAST_TAG}" ]]; then
            NEXT_VERSION="${BOOTSTRAP}"   # first release: keep Info.plist's version unchanged
          else
            V="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${V}"
            case "${BUMP}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              *) echo "::error::Unknown bump '${BUMP}' (expected patch|minor|major)" >&2; exit 1 ;;
            esac
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${NEXT_VERSION}"
          BUILD="$(git rev-list --count HEAD)"   # monotonic build number for CFBundleVersion

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. A ${BUMP} bump is not enough — pick a higher bump." >&2
            exit 1
          fi

          # Release note = merged PR title + description (the release note), then commits.
          TITLE="${PR_TITLE:-${TAG}}"
          {
            echo "## ${TITLE}"
            echo ""
            if [[ -n "${PR_BODY}" ]]; then
              echo "${PR_BODY}"
              echo ""
            fi
            echo "## Commits"
            echo ""
            if [[ -n "${LAST_TAG}" ]]; then
              git log --oneline "${LAST_TAG}..HEAD"
            else
              git log --oneline -20
            fi
          } > release-notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "Releasing ${TAG} (bump: ${BUMP})"
          cat release-notes.md

      # Write the computed SemVer into the .app's Info.plist before the build so the
      # shipped .dmg's version matches the release tag. The repo's Info.plist stays as a
      # 0.1.0 bootstrap; it is bumped here, not committed.
      - name: Bump app version
        if: steps.meta.outputs.skip != 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.meta.outputs.version }}" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.meta.outputs.build }}" Support/Info.plist
          echo "App version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist) (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Support/Info.plist))"

      # Fail fast with a clear per-secret message if any required secret is missing or
      # misnamed. GitHub separates Secrets from Variables — only `secrets.*` are read here,
      # so a value stored under the "Variables" tab will show up as missing below.
      - name: Validate secrets
        if: steps.meta.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              missing="${missing} ${v}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::These secrets are empty or not set (add them under Settings → Secrets and variables → Actions → Secrets):${missing}"
            exit 1
          fi
          echo "All required secrets are present."

      # Import the "Developer ID Application" certificate into a temporary keychain so
      # codesign / notarytool can run non-interactively.
      - name: Set up signing keychain
        if: steps.meta.outputs.skip != 'true'
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="temporary-keychain-password" # ephemeral; protects nothing durable
          CERT_P12="$RUNNER_TEMP/DeveloperIDApplication.p12"

          printf '%s' "$CERTIFICATE_B64" | openssl base64 -d -A -out "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_P12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERT_P12"

      # Build (arm64), sign with the Developer ID, notarize + staple, and wrap in a
      # signed .dmg — reusing the repo's own release pipeline.
      - name: Build, sign, notarize, and package .dmg
        if: steps.meta.outputs.skip != 'true'
        timeout-minutes: 30
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          Scripts/notarize.sh
          Scripts/release.sh

          echo "==> Verifying artifacts =="
          ls -la dist/
          file .build/FullLLMUsageWidget.app/Contents/MacOS/UsageWidget
          file dist/Full-LLM-Usage-Widget.dmg
          # Fail loudly if the binary is not arm64.
          file .build/FullLLMUsageWidget.app/Contents/MacOS/UsageWidget | grep -q arm64 \
            || { echo "ERROR: expected an arm64 binary" >&2; exit 1; }

      - name: Create GitHub Release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release-notes.md
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
